version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: jcas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jcas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jcas_secret}
      POSTGRES_DB: ${POSTGRES_DB:-jcas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jcas_user} -d ${POSTGRES_DB:-jcas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional DB browser) ───────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jcas_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jcas.edu
      PGADMIN_DEFAULT_PASSWORD: pgadmin_secret
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  # ── FastAPI Application ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jcas_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jcas_user}:${POSTGRES_PASSWORD:-jcas_secret}@db:5432/${POSTGRES_DB:-jcas_db}
    volumes:
      - ./uploads:/app/uploads
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
